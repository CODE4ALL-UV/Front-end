name: Flutter Test & Codecov Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code (v4.2.2)
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # 2. Set up Flutter (v2.12.0)
      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4840d5889ed270a312386a512702221b6d195

      # 3. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Run tests with coverage
      - name: Run Flutter tests with coverage
        run: flutter test --coverage

      # 5. Upload coverage to Codecov (v5.3.1)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c77da5bf9563814856f6f9c87893
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true