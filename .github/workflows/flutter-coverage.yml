name: Flutter Test & Codecov Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configurar el entorno de Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # 3. Obtener dependencias de Flutter
      - name: Install dependencies
        run: flutter pub get

      # 4. Ejecutar pruebas unitarias y generar el archivo coverage/lcov.info
      - name: Run Flutter tests with coverage
        run: flutter test --coverage

      # 5. Subir el reporte lcov.info a Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      # 6. Subir el mismo reporte a Codacy, donde está la cobertura del backend
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info